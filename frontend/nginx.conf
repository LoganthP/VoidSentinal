server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # dataset uploads: stream straight to the API (it enforces VS_MAX_UPLOAD_MB)
    location = /api/datasets/upload {
        client_max_body_size 1100m;
        proxy_request_buffering off;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 900s;   # validation of a large file happens before the response
        proxy_send_timeout 900s;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 120s;   # evaluation / retrain can take a few seconds
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # single-page app: unknown paths serve index.html
    location / {
        try_files $uri /index.html;
    }
}
