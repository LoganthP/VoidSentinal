<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" role="img" aria-label="VoidSentinel banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#101a3a"/>
      <stop offset="1" stop-color="#0a2a3a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="sweep" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#38bdf8" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>

    <!-- scanning line -->
    <rect x="0" y="0" width="1200" height="2" fill="#22d3ee" opacity="0.35">
      <animate attributeName="y" values="0;318;0" dur="7s" repeatCount="indefinite"/>
    </rect>

    <!-- radar -->
    <g transform="translate(1000 160)">
      <circle r="130" fill="none" stroke="#22d3ee" stroke-opacity="0.25"/>
      <circle r="90"  fill="none" stroke="#22d3ee" stroke-opacity="0.25"/>
      <circle r="50"  fill="none" stroke="#22d3ee" stroke-opacity="0.25"/>
      <line x1="-130" y1="0" x2="130" y2="0" stroke="#22d3ee" stroke-opacity="0.18"/>
      <line x1="0" y1="-130" x2="0" y2="130" stroke="#22d3ee" stroke-opacity="0.18"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite"/>
        <path d="M0 0 L130 0 A130 130 0 0 0 92 -92 Z" fill="url(#sweep)"/>
        <line x1="0" y1="0" x2="130" y2="0" stroke="#22d3ee" stroke-width="2" filter="url(#glow)"/>
      </g>
      <g filter="url(#glow)">
        <circle cx="62" cy="-48" r="4" fill="#f87171">
          <animate attributeName="opacity" values="0.1;1;0.1" dur="2.4s" repeatCount="indefinite"/>
          <animate attributeName="r" values="3;7;3" dur="2.4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="-70" cy="38" r="4" fill="#fbbf24">
          <animate attributeName="opacity" values="0.1;1;0.1" dur="3.1s" begin="0.8s" repeatCount="indefinite"/>
        </circle>
        <circle cx="20" cy="82" r="4" fill="#34d399">
          <animate attributeName="opacity" values="0.1;1;0.1" dur="2.8s" begin="1.4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="-30" cy="-95" r="3" fill="#a78bfa">
          <animate attributeName="opacity" values="0.1;1;0.1" dur="3.6s" begin="0.4s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>

    <!-- title -->
    <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
      <text x="60" y="120" font-size="64" font-weight="800" fill="url(#title)" filter="url(#glow)" letter-spacing="2">VOIDSENTINEL</text>
      <text x="62" y="162" font-size="22" fill="#cbd5e1" letter-spacing="1">Cloud SSH Honeypot &#xB7; AI-Assisted Threat Analysis</text>
    </g>
    <g font-family="'Consolas','Courier New',monospace" font-size="16" fill="#7dd3fc">
      <text x="62" y="212">$ ssh root@decoy <tspan fill="#94a3b8">&#x2192; Cowrie &#x2192; Rules &#x2192; Isolation Forest &#x2192; Verdict</tspan></text>
      <rect x="62" y="228" width="9" height="18" fill="#22d3ee">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- chips -->
    <g font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#e2e8f0">
      <rect x="62" y="262" width="96" height="26" rx="13" fill="#0ea5e9" fill-opacity="0.2" stroke="#38bdf8" stroke-opacity="0.6"/>
      <text x="110" y="280" text-anchor="middle">Lab mode</text>
      <rect x="170" y="262" width="104" height="26" rx="13" fill="#8b5cf6" fill-opacity="0.2" stroke="#a78bfa" stroke-opacity="0.6"/>
      <text x="222" y="280" text-anchor="middle">Cloud mode</text>
      <rect x="286" y="262" width="132" height="26" rx="13" fill="#10b981" fill-opacity="0.2" stroke="#34d399" stroke-opacity="0.6"/>
      <text x="352" y="280" text-anchor="middle">Dataset Import</text>
    </g>
  </g>
</svg>
