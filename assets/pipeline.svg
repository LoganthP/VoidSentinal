<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="100%" role="img" aria-label="Animated data pipeline">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f87171"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="230" rx="16" fill="#0b1020"/>
  <path id="p" d="M90 105 H1110" stroke="url(#line)" stroke-width="3" stroke-dasharray="8 8" fill="none">
    <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.2s" repeatCount="indefinite"/>
  </path>

  <g font-family="'Segoe UI',Arial,sans-serif" text-anchor="middle">
    <!-- nodes -->
    <g>
      <circle cx="90"   cy="105" r="30" fill="#7f1d1d" stroke="#f87171" stroke-width="2"/>
      <circle cx="260"  cy="105" r="30" fill="#78350f" stroke="#fbbf24" stroke-width="2"/>
      <circle cx="430"  cy="105" r="30" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
      <circle cx="600"  cy="105" r="30" fill="#4c1d95" stroke="#a78bfa" stroke-width="2"/>
      <circle cx="770"  cy="105" r="30" fill="#134e4a" stroke="#2dd4bf" stroke-width="2"/>
      <circle cx="940"  cy="105" r="30" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
      <circle cx="1110" cy="105" r="30" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
      <g filter="url(#g)">
        <circle cx="90"   cy="105" r="30" fill="none" stroke="#f87171" opacity="0.5"><animate attributeName="r" values="30;40;30" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;0;0.6" dur="2s" repeatCount="indefinite"/></circle>
        <circle cx="1110" cy="105" r="30" fill="none" stroke="#38bdf8" opacity="0.5"><animate attributeName="r" values="30;40;30" dur="2s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;0;0.6" dur="2s" begin="1s" repeatCount="indefinite"/></circle>
      </g>
    </g>
    <!-- icons (emoji-free glyphs) -->
    <g font-size="22" fill="#fff" font-weight="700">
      <text x="90"   y="113">&#x26A0;</text>
      <text x="260"  y="113">&#x1F36F;</text>
      <text x="430"  y="113">&#x21C4;</text>
      <text x="600"  y="113">&#x2699;</text>
      <text x="770"  y="113">&#x1F5C4;</text>
      <text x="940"  y="113">&#x26A1;</text>
      <text x="1110" y="113">&#x25A6;</text>
    </g>
    <!-- labels -->
    <g font-size="15" fill="#e2e8f0" font-weight="600">
      <text x="90"   y="165">Attacker</text>
      <text x="260"  y="165">Cowrie decoy</text>
      <text x="430"  y="165">Collector</text>
      <text x="600"  y="165">Worker</text>
      <text x="770"  y="165">SQLite</text>
      <text x="940"  y="165">FastAPI</text>
      <text x="1110" y="165">Dashboard</text>
    </g>
    <g font-size="12" fill="#94a3b8">
      <text x="90"   y="185">ssh / telnet</text>
      <text x="260"  y="185">fake shell :2222</text>
      <text x="430"  y="185">sanitize + ship</text>
      <text x="600"  y="185">sessions &#xB7; rules &#xB7; ML</text>
      <text x="770"  y="185">events &#xB7; alerts</text>
      <text x="940"  y="185">REST + auth</text>
      <text x="1110" y="185">127.0.0.1:8081</text>
    </g>
  </g>

  <!-- travelling packets -->
  <g filter="url(#g)">
    <circle r="6" fill="#fbbf24"><animateMotion dur="6s" repeatCount="indefinite"><mpath href="#p"/></animateMotion></circle>
    <circle r="6" fill="#a78bfa"><animateMotion dur="6s" begin="2s" repeatCount="indefinite"><mpath href="#p"/></animateMotion></circle>
    <circle r="6" fill="#34d399"><animateMotion dur="6s" begin="4s" repeatCount="indefinite"><mpath href="#p"/></animateMotion></circle>
  </g>
</svg>
